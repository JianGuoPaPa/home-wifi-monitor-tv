plugins {
    id "com.android.application"
}

android {
    namespace "org.homewifimonitor.tv"
    compileSdk 35

    defaultConfig {
        applicationId "org.homewifimonitor.tv"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.json:json:20240303"
}
